<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge Plan">
<title>Forge Plan</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B2230;--s1:#232C3B;--s2:#2C3648;--line:#3A4558;
  --text:#EDF0F4;--muted:#9BA7B9;--me:#F2B632;--her:#D59BF6;--ok:#5ED3A5;--bad:#F0705A;
  --acc:var(--me);--other:var(--her);--ink:#1B2230;
  --cond:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
body[data-p="wife"]{--acc:var(--her);--other:var(--me)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
img{max-width:100%}

header.top{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.brand{font:700 22px/1 var(--cond);margin-right:auto;letter-spacing:.01em}
.brand span{color:var(--acc)}
.seg{display:flex;background:var(--s1);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
.icon-btn{border:0;background:var(--s1);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

main{max-width:560px;margin:0 auto;padding:12px 16px 120px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--s1);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--acc)}
nav.tabs button[hidden]{display:none}

.hero{padding:10px 0 4px}
.hero .date{color:var(--muted);margin:0;font-weight:500}
.hero h1{font:800 clamp(60px,21vw,112px)/.86 var(--cond);margin:6px 0 6px;color:var(--acc);letter-spacing:-.01em;word-break:break-word}
.hero.mid h1{font-size:clamp(48px,15vw,84px)}
.hero .sub{margin:0;font-weight:500;max-width:46ch}
h2{font:700 23px/1.1 var(--cond);margin:28px 0 10px;display:flex;align-items:baseline;gap:8px}
h2 small{font:600 15px var(--body);color:var(--muted)}
h3{font:700 19px/1.2 var(--cond);margin:22px 0 8px}
.note{color:var(--muted);font-size:14px;margin:0 0 10px}
.panel{background:var(--s1);border-radius:16px;padding:6px 14px}
.panel.pad{padding:14px}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 0;border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background .15s}
.done .tick,.tick.on{background:var(--acc);border-color:var(--acc)}
.done .tick::after,.tick.on::after{content:"";width:10px;height:6px;border:2.5px solid var(--ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.done .txt,.done .exname{color:var(--muted);text-decoration:line-through}
.txt{flex:1}
.x{border:0;background:none;color:var(--muted);font-size:20px;padding:0 4px;line-height:1}

.ex{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tickbtn{border:0;background:none;padding:0}
.exbody{flex:1;min-width:0}
.exname{font-weight:600}
.exmeta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:14px}
.exmeta .eq{color:var(--text);opacity:.8}
.last{font-size:13px;color:var(--muted)}
.shared{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--other);border:1px solid var(--other);border-radius:999px;padding:1px 9px}
.kg{width:68px;flex:none}
.kg input{text-align:center;padding:8px 4px}

input,select,textarea{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 0}
label.f input,label.f select{margin-top:4px;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{background:var(--acc);color:var(--ink);border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px}
.btn.ghost{background:var(--s2);color:var(--text)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}

.water{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.round{width:48px;height:48px;border-radius:50%;padding:0;font-size:26px;line-height:1}
.wcount{text-align:center}
.wcount strong{font:800 40px/1 var(--cond);color:var(--acc)}
.wcount span{display:block;color:var(--muted);font-size:13px}

.sum{display:block;width:100%;text-align:left;border:0}
.sumline{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 5px;font-size:14px;color:var(--muted)}
.sumline b{color:var(--text);font-size:16px}
.bar{height:8px;background:var(--s2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.over i{background:var(--bad)}
.status{margin:12px 0 4px;font-weight:600}
.status.good{color:var(--ok)}.status.warn{color:var(--bad)}

.days{display:flex;gap:6px;margin:8px 0 6px}
.days button{flex:1;min-width:0;border:0;background:var(--s1);border-radius:10px;padding:9px 0 7px;font-weight:600;font-size:14px;position:relative}
.days button[aria-pressed="true"]{background:var(--acc);color:var(--ink)}
.days button.today::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.excard{background:var(--s1);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.excard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.excard .sets{font:700 18px var(--cond);color:var(--acc);white-space:nowrap}
.excard .tip{font-size:14px;color:var(--muted);margin:4px 0 0}
.together{border:1px dashed var(--other);border-radius:14px;padding:12px 14px;margin-top:18px}
.together h3{margin:0 0 6px;color:var(--other)}
.together ul{margin:6px 0 0;padding-left:18px}

.datenav{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.datenav button{border:0;background:var(--s1);width:40px;height:40px;border-radius:50%;font-size:22px}
.datenav strong{font-weight:600}
.meal{margin-top:14px}
.meal h3{margin:0 0 4px;display:flex;justify-content:space-between}
.meal h3 small{font:600 14px var(--body);color:var(--muted)}
.fitem{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.fitem .n{flex:1}
.fitem .m{font-size:13px;color:var(--muted)}
.fitem .k{font-weight:700;white-space:nowrap}
.pending{border:1px solid var(--acc);border-radius:14px;padding:12px 14px;margin-top:12px}
details summary{cursor:pointer;color:var(--muted);margin-top:12px;font-weight:600}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery button{border:0;padding:0;background:var(--s1);border-radius:10px;overflow:hidden;text-align:left}
.gallery .ph{aspect-ratio:3/4;background:var(--s2);display:grid;place-items:center;color:var(--muted);font-size:13px}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .cap{padding:5px 7px;font-size:13px}
.gallery .cap b{display:block;font-size:14px}
.chart{width:100%;height:auto;display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;text-align:left}
.msgs{margin-top:8px}
.msg{padding:10px 13px;border-radius:14px;margin:8px 0;max-width:92%;overflow-wrap:anywhere}
.msg.user{background:var(--acc);color:var(--ink);margin-left:auto;border-bottom-right-radius:4px}
.msg.ai{background:var(--s1);border-bottom-left-radius:4px}
.msg.err{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0 6px;padding-left:18px}
.typing{color:var(--muted);font-style:italic;margin:8px 0}

dialog{background:var(--s1);color:var(--text);border:0;border-radius:18px;width:min(540px,94vw);max-height:88vh;padding:18px;overflow:auto}
dialog::backdrop{background:rgba(10,14,22,.72)}
dialog h2{margin-top:0}
.bigphoto{width:100%;border-radius:12px;display:block;background:var(--s2)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--ink);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-p="me">
<header class="top">
  <div class="brand">Forge<span>Plan</span></div>
  <div class="seg" role="group" aria-label="Whose plan">
    <button data-a="prof" data-p="me" id="pMe">Me</button>
    <button data-a="prof" data-p="wife" id="pWife">Wife</button>
  </div>
  <button class="icon-btn" data-a="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Sections">
  <button data-a="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Today</button>
  <button data-a="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Plan</button>
  <button data-a="tab" data-tab="food" id="tabFood"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>Food</button>
  <button data-a="tab" data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 9a5 5 0 0 1 8 0l-3 3"/></svg>Body</button>
  <button data-a="tab" data-tab="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Coach</button>
</nav>

<dialog id="dlg"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast('Phone storage is full. Export a backup and delete old photos.'); } }
};
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ORDER = [1,2,3,4,5,6,0];
const z = n => String(n).padStart(2,'0');
const dkey = (d = new Date()) => `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const toDate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = toDate(k); d.setDate(d.getDate()+n); return dkey(d); };
const dowOf = k => toDate(k).getDay();
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmt = n => Math.round(n).toLocaleString('en-IN');
const fmtLong = d => d.toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'});
const fmtShort = k => toDate(k).toLocaleDateString('en-IN', {day:'numeric', month:'short'});
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }

/* ---------- photo storage (IndexedDB) ---------- */
const idb = {
  _db:null,
  open(){ return this._db || (this._db = new Promise((res, rej) => {
    const r = indexedDB.open('forgeplan', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  })); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => {
    const t = db.transaction('photos', mode); const out = fn(t.objectStore('photos'));
    t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
  }); },
  put(k, v){ return this.tx('readwrite', s => s.put(v, k)); },
  get(k){ return this.tx('readonly', s => s.get(k)); },
  del(k){ return this.tx('readwrite', s => s.delete(k)); },
  clear(){ return this.tx('readwrite', s => s.clear()); },
  async all(){ const keys = await this.tx('readonly', s => s.getAllKeys()); const vals = await this.tx('readonly', s => s.getAll());
    const o = {}; (keys||[]).forEach((k,i) => o[k] = vals[i]); return o; }
};
function compress(file, max = 1000){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .78));
    }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ---------- equipment & plans ---------- */
const EQ = {
  bench:{n:'Flat bench + barbell', m:true},
  incline:{n:'Adjustable bench + dumbbells', m:true},
  chestM:{n:'Chest press machine', m:true},
  shoulderM:{n:'Shoulder press machine', m:true},
  cable:{n:'Cable station', m:true},
  pulldown:{n:'Lat pulldown machine', m:true},
  row:{n:'Seated cable row', m:true},
  rowM:{n:'Chest-supported row machine', m:true},
  legpress:{n:'Leg press machine', m:true},
  legcurl:{n:'Leg curl machine', m:true},
  legext:{n:'Leg extension machine', m:true},
  calf:{n:'Calf raise machine', m:true},
  smith:{n:'Smith machine', m:true},
  rack:{n:'Squat rack + barbell', m:true},
  hip:{n:'Hip thrust bench + barbell', m:true},
  chair:{n:"Captain's chair", m:true},
  tread:{n:'Treadmill', m:true},
  db:{n:'Dumbbells', m:false},
  barbell:{n:'Barbell + plates', m:false},
  mat:{n:'Mat', m:false}
};
const X = (name, eq, sets, rest, tip) => ({ id: name.toLowerCase().replace(/[^a-z0-9]+/g,'-'), name, eq, sets, rest, tip, cardio: eq === 'tread' });
const WARMUP = 'Start with 5 min bike or brisk walk, then arm circles, leg swings and 10 bodyweight squats. First 2 weeks: go light and learn form.';
const REST = (note) => ({ title:'Rest', sub:'Recovery day', rest:true, ex:[], note });

const ME_PUSH = { title:'Push', sub:'Chest, shoulders, triceps + cardio', ex:[
  X('Barbell bench press','bench','4 × 6–10','2–3 min','Feet planted, shoulder blades squeezed. Lower the bar to mid-chest with control.'),
  X('Incline dumbbell press','incline','3 × 8–10','2 min','Bench at about 30°. Press up and slightly in.'),
  X('Shoulder press','shoulderM','3 × 8–10','90 s','Do not shrug. Stop just short of locking elbows.'),
  X('Cable chest fly','cable','3 × 12–15','60 s','Slight bend in elbows, squeeze chest at the middle.'),
  X('Lateral raise','db','3 × 12–15','60 s','Light weight, lead with elbows, stop at shoulder height.'),
  X('Tricep pushdown','cable','3 × 12','60 s','Elbows pinned to your sides.'),
  X('Incline treadmill walk','tread','20–25 min','—','Incline 8–12, speed 4.5–5.5 km/h. Do not hold the rails.')
]};
const ME_PULL = { title:'Pull', sub:'Back, biceps + cardio', ex:[
  X('Lat pulldown','pulldown','4 × 6–10','2–3 min','Pull to upper chest, chest up, no swinging.'),
  X('Seated cable row','row','3 × 8–10','2 min','Sit tall, pull to your belly, squeeze shoulder blades.'),
  X('Chest-supported row','rowM','3 × 10','90 s','Chest stays on the pad. Slow lowering.'),
  X('Face pull','cable','3 × 15','60 s','Rope to forehead, elbows high. Great for posture.'),
  X('Dumbbell curl','db','3 × 12','60 s','No swinging. Lower slowly.'),
  X('Hammer curl','db','2 × 12','60 s','Thumbs up grip.'),
  X('Incline treadmill walk','tread','20–25 min','—','Incline 8–12, speed 4.5–5.5 km/h.')
]};
const ME_LEGS = { title:'Legs', sub:'Quads, hamstrings, calves, core', ex:[
  X('Back squat','rack','4 × 6–10','2–3 min','Use the Smith machine if the rack is busy. Knees follow toes, chest up.'),
  X('Romanian deadlift','barbell','3 × 8–10','2 min','Push hips back, bar close to legs, back flat.'),
  X('Leg press','legpress','3 × 10–12','90 s','Lower until knees reach about 90°. Do not lock knees.'),
  X('Leg curl','legcurl','3 × 12','60 s','Slow on the way back.'),
  X('Calf raise','calf','3 × 15','60 s','Full stretch at bottom, pause at top.'),
  X('Hanging knee raise','chair','3 × 12','60 s','Curl the hips up, no swinging.'),
  X('Easy treadmill walk','tread','10–15 min','—','Flat or light incline. Legs are tired today.')
]};
const HER_PUSH = { title:'Upper', sub:'Chest, shoulders, arms', ex:[
  X('Chest press','chestM','3 × 8–10','2 min','Handles at mid-chest level, push smoothly.'),
  X('Incline dumbbell press','incline','3 × 10','90 s','Bench at about 30°.'),
  X('Shoulder press','shoulderM','3 × 10','90 s','Stop just short of locking elbows.'),

/* ---------- settings & state ---------- */
const DEF = { groqKey:'', model:'openai/gpt-oss-120b',
  me:{ name:'Me', height:185, start:92, goal:82, kcal:2300, protein:150, water:12, steps:9000 },
  wife:{ name:'Wife', height:170, start:61, goal:66, kcal:2300, protein:110, water:10 } };
function loadS(){ const s = LS.get('fp:settings', {}); return { ...DEF, ...s, me:{...DEF.me, ...(s.me||{})}, wife:{...DEF.wife, ...(s.wife||{})} }; }
let S = loadS();
const st = { tab: LS.get('fp:tab','today'), p: LS.get('fp:profile','me'), planDow: new Date().getDay(), foodDate: dkey(), pending:null, busy:false, aiBusy:false };
const other = p => p === 'me' ? 'wife' : 'me';

function getDay(p, k){ const d = LS.get(`fp:day:${p}:${k}`, {}); return { todos:{}, water:0, custom:[], ex:{}, ...d }; }
function saveDay(p, k, d){ LS.set(`fp:day:${p}:${k}`, d); }
function weights(p){ return LS.get(`fp:weights:${p}`, []).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }
function foodItems(k){ return LS.get(`fp:food:${k}`, []); }
function totals(items){ return items.reduce((t,i) => ({ kcal:t.kcal+num(i.kcal), p:t.p+num(i.protein), c:t.c+num(i.carbs), f:t.f+num(i.fat) }), {kcal:0,p:0,c:0,f:0}); }
function sharedSet(p, dow){ const op = PLANS[other(p)][dow]; return new Set(op.rest ? [] : op.ex.filter(e => EQ[e.eq].m).map(e => e.eq)); }
function lastKg(p, id, k){ for(let i = 1; i <= 21; i++){ const d = LS.get(`fp:day:${p}:${addDays(k,-i)}`, null); if(d && d.ex && d.ex[id] && d.ex[id].kg) return { kg:d.ex[id].kg, date:addDays(k,-i) }; } return null; }

function todosFor(p, dow){
  const train = !PLANS[p][dow].rest;
  const t = [{id:'seed', text:'Soaked seed water'}];
  if(train) t.push(
    {id:'pre', text: p==='me' ? 'Pre-gym: banana, or 1 slice bread with a thin layer of peanut butter' : 'Pre-gym: bread with peanut butter plus a banana'},
    {id:'warm', text:'Warm-up 10 min'}, {id:'stretch', text:'Stretch 5 min after the workout'});
  else t.push({id:'walk', text:'Light walk 20–30 min'});
  t.push({id:'bfast', text:'Protein-rich breakfast within 2 hours of gym'}, {id:'shake', text:'Protein shake'});
  if(p === 'me') t.push({id:'steps', text:`${fmt(S.me.steps)} steps`}, {id:'log', text:'Log every meal in Food'}, {id:'nosugar', text:'No sweets, sugary chai or fried snacks'});
  else t.push({id:'snack', text:'Extra snack: nuts, milk, curd or a banana shake'}, {id:'meals', text:'3 meals + 2 snacks'});
  t.push({id:'sleep', text:'Sleep 7–8 hours'});
  return t;
}

    status += pLeft > 0 ? ` Still need ${fmt(pLeft)} g protein.` : ' Protein target reached.'; }

    if(r < .8){ status = 'Well under target. Too big a deficit can cost muscle and energy.'; cls = 'warn'; }

function chart(w, goal){
  const W = 340, H = 160, L = 34, R = 10, T = 12, B = 22;
  const vals = w.map(x => num(x.kg)).concat(goal), mn = Math.floor(Math.min(...vals) - 1), mx = Math.ceil(Math.max(...vals) + 1);
  const t0 = toDate(w[0].date).getTime(), t1 = toDate(w[w.length-1].date).getTime(), span = (t1 - t0) || 1;
  const x = k => L + (toDate(k).getTime() - t0) / span * (W - L - R), y = v => T + (mx - v) / (mx - mn) * (H - T - B);
  const pts = w.map(e => `${x(e.date).toFixed(1)},${y(num(e.kg)).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
    <line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ok)" stroke-dasharray="4 4"/>
    <text x="${W-R}" y="${y(goal)-4}" fill="var(--ok)" font-size="11" text-anchor="end">Goal ${goal} kg</text>
    <text x="${L-6}" y="${T+4}" fill="var(--muted)" font-size="11" text-anchor="end">${mx}</text>
    <text x="${L-6}" y="${H-B}" fill="var(--muted)" font-size="11" text-anchor="end">${mn}</text>
    <text x="${L}" y="${H-4}" fill="var(--muted)" font-size="11">${fmtShort(w[0].date)}</text>
    <text x="${W-R}" y="${H-4}" fill="var(--muted)" font-size="11" text-anchor="end">${fmtShort(w[w.length-1].date)}</text>
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>
    ${w.map(e => `<circle cx="${x(e.date)}" cy="${y(num(e.kg))}" r="3.5" fill="var(--acc)"/>`).join('')}</svg>`;
}

function md(t){
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').split('\n');
  let out = '', inList = false;
  for(const raw of lines){ const l = raw.trim();
    if(/^([-*•]|\d+\.)\s+/.test(l)){ if(!inList){ out += '<ul>'; inList = true; } out += `<li>${l.replace(/^([-*•]|\d+\.)\s+/, '')}</li>`; }
    else { if(inList){ out += '</ul>'; inList = false; } if(l) out += `<p>${l.replace(/^#+\s*/, '')}</p>`; } }
  return out + (inList ? '</ul>' : '');
}

/* ---------- AI ---------- */
async function groq(messages, { json = false, key = S.groqKey, model = S.model } = {}){
  if(!key) throw new Error('Add your Groq API key in Settings first.');
  const body = { model: model || DEF.model, messages, temperature: .4, max_completion_tokens: 2000 };
  if(/gpt-oss/.test(body.model)) body.reasoning_effort = 'low';
  if(json) body.response_format = { type: 'json_object' };
  let r;
  try{ r = await fetch('https://api.groq.com/openai/v1/chat/completions', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key }, body: JSON.stringify(body) }); }
  catch(e){ throw new Error('Could not reach Groq. Check your internet connection.'); }
  const data = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error((data.error && data.error.message) || `Groq returned error ${r.status}.`);
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
}
function parseJSON(s){ try{ return JSON.parse(s); }catch(e){ const m = s.match(/\{[\s\S]*\}/); if(m) try{ return JSON.parse(m[0]); }catch(e2){} } return null; }

function buildContext(p){
  const s = S[p], today = dkey(), dow = new Date().getDay(), w = weights(p), latest = w[w.length-1];
  let c = `Person: ${s.name}, ${p === 'me' ? 'husband, goal: lose fat while keeping muscle' : 'wife, goal: gain weight as lean muscle'}. Height ${s.height} cm. Start weight ${s.start} kg, goal ${s.goal} kg. Latest logged weight: ${latest ? latest.kg + ' kg on ' + latest.date : 'not logged yet'}.\n`;
  c += `Daily targets: ${s.kcal} kcal, ${s.protein} g protein, ${s.water} glasses of water${p === 'me' ? ', ' + s.steps + ' steps' : ''}.\n`;
  c += `Routine: trains mornings at Iron Forge gym, Hyderabad, ${p === 'me' ? '6' : '5'} days a week, with spouse. Drinks soaked pumpkin, chia, flax and sunflower seed water daily.\nToday is ${DAYS[dow]} (${today}). Today's plan: ${PLANS[p][dow].title}${PLANS[p][dow].rest ? '' : ' - ' + PLANS[p][dow].ex.map(e => e.name + ' ' + e.sets).join(', ')}.\n`;
  if(w.length) c += `Weight history: ${w.slice(-8).map(e => `${e.date} ${e.kg} kg${e.waist ? ' waist ' + e.waist + ' cm' : ''}`).join('; ')}.\n`;
  c += 'Last 7 days:\n';
  for(let i = 6; i >= 0; i--){
    const k = addDays(today, -i), d = getDay(p, k), plan = PLANS[p][dowOf(k)];
    const exDone = plan.ex.filter(e => (d.ex[e.id]||{}).done), kgs = plan.ex.filter(e => (d.ex[e.id]||{}).kg).map(e => `${e.name} ${d.ex[e.id].kg}kg`);
    const td = todosFor(p, dowOf(k)), tdDone = td.filter(t => d.todos[t.id]).map(t => t.id);
    let line = `- ${k} ${DAYS[dowOf(k)]}: ${plan.title}${plan.rest ? '' : `, exercises done ${exDone.length}/${plan.ex.length}`}${kgs.length ? ' (' + kgs.join(', ') + ')' : ''}; water ${d.water} glasses; checklist done: ${tdDone.join(', ') || 'none'}`;
    if(p === 'me'){ const it = foodItems(k), t = totals(it);
      line += it.length ? `; food ${Math.round(t.kcal)} kcal, protein ${Math.round(t.p)} g` : '; food not logged';
      if(i === 0 && it.length) line += ` [today: ${it.map(x => `${x.meal}: ${x.name} ${Math.round(num(x.kcal))} kcal`).join('; ')}]`; }
    c += line + '\n';
  }
  return c;
}
const SYS = `You are a practical, evidence-based gym coach and nutrition guide inside a personal app used by an Indian couple in Hyderabad. Use Indian foods, kg and kcal. Be warm and direct: lead with the key point, then at most 5 short bullet points. Base every comment on the data below; if something is not logged, say what to log instead of guessing. You are not a doctor: for pain, dizziness or medical conditions, tell them to see one. Never suggest crash diets, eating below 1,800 kcal for the husband, or unsafe supplements.\n\nDATA:\n`;

async function ask(q){
  if(st.aiBusy || !q.trim()) return;
  const p = st.p, chat = LS.get(`fp:chat:${p}`, []);
  chat.push({ r:'user', t:q.trim() }); LS.set(`fp:chat:${p}`, chat); st.aiBusy = true; render(); scrollEnd();
  try{
    const msgs = [{ role:'system', content: SYS + buildContext(p) }, ...chat.filter(m => m.r !== 'err').slice(-10).map(m => ({ role: m.r === 'user' ? 'user' : 'assistant', content: m.t }))];
    const out = await groq(msgs); chat.push({ r:'ai', t: out.trim() || 'No answer came back. Try again.' });
  }catch(e){ chat.push({ r:'err', t: e.message }); }
  LS.set(`fp:chat:${p}`, chat.slice(-40)); st.aiBusy = false; if(st.tab === 'ai') { render(); scrollEnd(); }
}
const scrollEnd = () => window.scrollTo({ top: document.body.scrollHeight });

/* ---------- settings dialog ---------- */
function openSettings(){
  const f = (pre, k, label, t = 'numeric') => `<label class="f">${label}<input name="${pre}.${k}" ${t==='text'?'':'inputmode="numeric"'} value="${esc(S[pre][k])}"></label>`;
  const dlg = $('#dlg');
  dlg.innerHTML = `<form data-f="settings"><h2>Settings</h2>
    <h3>AI coach (Groq)</h3>
    <label class="f">Groq API key<input name="groqKey" type="password" autocomplete="off" value="${esc(S.groqKey)}" placeholder="gsk_..."></label>
    <p class="note" style="margin-top:6px">Create a free key at console.groq.com/keys. It is saved only on this phone.</p>
    <label class="f">Model<input name="model" list="models" value="${esc(S.model)}"></label>
    <datalist id="models"><option value="openai/gpt-oss-120b"><option value="openai/gpt-oss-20b"></datalist>
    <p class="note" style="margin-top:6px">If Groq retires this model, copy a current one from console.groq.com/docs/models.</p>
    <div class="btns"><button type="button" class="btn ghost" data-a="testKey">Test connection</button></div>
    <h3>You</h3><div class="grid2">${f('me','name','Name','text')}${f('me','height','Height (cm)')}${f('me','start','Start weight (kg)')}${f('me','goal','Goal weight (kg)')}${f('me','kcal','Calories per day')}${f('me','protein','Protein (g)')}${f('me','water','Water (glasses)')}${f('me','steps','Steps per day')}</div>
    <h3>Wife</h3><div class="grid2">${f('wife','name','Name','text')}${f('wife','height','Height (cm)')}${f('wife','start','Start weight (kg)')}${f('wife','goal','Goal weight (kg)')}${f('wife','kcal','Calories per day')}${f('wife','protein','Protein (g)')}${f('wife','water','Water (glasses)')}</div>
    <div class="btns"><button class="btn">Save settings</button><button type="button" class="btn ghost" data-a="close">Cancel</button></div>
    <h3>Backup</h3><p class="note">All data lives in this browser. Clearing browser data deletes it, so export a backup every few weeks. The API key is not included.</p>
    <div class="btns"><button type="button" class="btn ghost" data-a="export">Export backup</button><button type="button" class="btn ghost" data-a="import">Import backup</button><button type="button" class="btn danger" data-a="wipe">Delete all data</button></div>
  </form>`;
  dlg.showModal();
}
function readSettingsForm(form){
  const fd = new FormData(form), n = JSON.parse(JSON.stringify(S));
  for(const [k, v] of fd.entries()){ const [a, b] = k.split('.');
    if(b) n[a][b] = b === 'name' ? (String(v).trim() || DEF[a].name) : (num(v) || DEF[a][b]); else n[a] = String(v).trim(); }
  return n;
}
async function exportData(){
  const data = { app:'forgeplan', v:1, at:new Date().toISOString(), ls:{}, photos:{} };
  for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k.startsWith('fp:')) data.ls[k] = localStorage.getItem(k); }
  data.ls['fp:settings'] = JSON.stringify({ ...S, groqKey:'' });
  try{ data.photos = await idb.all(); }catch(e){}
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type:'application/json' }));
  a.download = `forgeplan-backup-${dkey()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Backup exported.');
}
async function importData(file){
  try{
    const data = JSON.parse(await file.text()); if(data.app !== 'forgeplan') throw 0;
    const key = S.groqKey;
    Object.entries(data.ls || {}).forEach(([k, v]) => localStorage.setItem(k, v));
    for(const [k, v] of Object.entries(data.photos || {})) await idb.put(k, v);
    S = loadS(); if(!S.groqKey && key){ S.groqKey = key; LS.set('fp:settings', S); }
    $('#dlg').close(); render(); toast('Backup imported.');
  }catch(e){ toast('That file is not a Forge Plan backup.'); }
}

/* ---------- render ---------- */
const VIEWS = { today:vToday, plan:vPlan, food:vFood, body:vBody, ai:vAI };
function render(){
  if(st.p === 'wife' && st.tab === 'food') st.tab = 'today';
  document.body.dataset.p = st.p;
  $('#pMe').textContent = S.me.name; $('#pWife').textContent = S.wife.name;
  $('#pMe').setAttribute('aria-pressed', st.p === 'me'); $('#pWife').setAttribute('aria-pressed', st.p === 'wife');
  $('#tabFood').hidden = st.p === 'wife';
  document.querySelectorAll('nav.tabs button').forEach(b => { if(b.dataset.tab === st.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('#view').innerHTML = VIEWS[st.tab]();
  document.querySelectorAll('img[data-photo]').forEach(img => idb.get('p:' + img.dataset.photo).then(src => { if(src) img.src = src; }).catch(()=>{}));
}

/* ---------- actions ---------- */
const A = {
  tab(b){ st.tab = b.dataset.tab; LS.set('fp:tab', st.tab); render(); window.scrollTo(0,0); },
  prof(b){ st.p = b.dataset.p; st.pending = null; LS.set('fp:profile', st.p); render(); },
  todo(b){ const k = dkey(), d = getDay(st.p, k); d.todos[b.dataset.id] = !d.todos[b.dataset.id]; saveDay(st.p, k, d); render(); },
  ctodo(b){ const k = dkey(), d = getDay(st.p, k), c = d.custom.find(x => x.id === b.dataset.id); if(c) c.done = !c.done; saveDay(st.p, k, d); render(); },
  cdel(b){ const k = dkey(), d = getDay(st.p, k); d.custom = d.custom.filter(x => x.id !== b.dataset.id); saveDay(st.p, k, d); render(); },
  exDone(b){ const k = dkey(), d = getDay(st.p, k), x = d.ex[b.dataset.id] || {}; x.done = !x.done; d.ex[b.dataset.id] = x; saveDay(st.p, k, d); render(); },
  water(b){ const k = dkey(), d = getDay(st.p, k); d.water = Math.max(0, d.water + Number(b.dataset.d)); saveDay(st.p, k, d); render(); },
  planDay(b){ st.planDow = Number(b.dataset.d); render(); },
  foodNav(b){ const n = addDays(st.foodDate, Number(b.dataset.d)); if(n <= dkey()){ st.foodDate = n; st.pending = null; render(); } },
  async foodAI(){
    const text = $('#foodText').value.trim(), meal = $('#mealSel').value; if(!text) return toast('Type what you ate first.');
    st.busy = true; render(); $('#foodText').value = text; $('#mealSel').value = meal;
    try{
      const sys = 'You estimate nutrition for Indian and international foods. Assume typical Indian home portions (1 phulka or roti about 80-100 kcal, 1 katori about 150 g cooked) unless quantities are given. Return ONLY a JSON object: {"items":[{"name":string,"qty":string,"kcal":number,"protein":number,"carbs":number,"fat":number}]}. protein, carbs and fat are grams. Use whole numbers. One item per distinct food.';
      const j = parseJSON(await groq([{ role:'system', content:sys }, { role:'user', content:text }], { json:true }));
      const items = (j && Array.isArray(j.items) ? j.items : []).filter(i => i && i.name).map(i => ({ name:String(i.name), qty:String(i.qty||''), kcal:num(i.kcal), protein:num(i.protein), carbs:num(i.carbs), fat:num(i.fat) }));
      if(!items.length) throw new Error('The AI could not read that. Try listing foods with amounts.');
      st.pending = { meal, items, text };
    }catch(e){ toast(e.message); }
    st.busy = false; render(); if(!st.pending){ $('#foodText').value = text; }
  },
  pendingAdd(){ const k = st.foodDate, list = foodItems(k); st.pending.items.forEach(i => list.push({ id:uid(), meal:st.pending.meal, ...i })); LS.set(`fp:food:${k}`, list); toast(`Added to ${st.pending.meal}.`); st.pending = null; render(); },
  pendingClear(){ st.pending = null; render(); },
  foodDel(b){ const k = st.foodDate; LS.set(`fp:food:${k}`, foodItems(k).filter(i => i.id !== b.dataset.id)); render(); },
  async entry(b){
    const p = st.p, e = weights(p).find(x => x.id === b.dataset.id); if(!e) return;
    const src = e.photo ? await idb.get('p:' + e.id).catch(() => null) : null, dlg = $('#dlg');
    dlg.innerHTML = `<h2>${fmtLong(toDate(e.date))}</h2>${src ? `<img class="bigphoto" src="${src}" alt="Progress photo">` : ''}
      <p><strong>${esc(e.kg)} kg</strong>${e.waist ? `, waist ${esc(e.waist)} cm` : ''}</p>
      <div class="btns"><button class="btn ghost" data-a="close">Close</button><button class="btn danger" data-a="entryDel" data-id="${e.id}">Delete check-in</button></div>`;
    dlg.showModal();
  },
  async entryDel(b){ if(!confirm('Delete this check-in and its photo?')) return; const p = st.p;
    LS.set(`fp:weights:${p}`, weights(p).filter(x => x.id !== b.dataset.id)); await idb.del('p:' + b.dataset.id).catch(()=>{}); $('#dlg').close(); render(); toast('Check-in deleted.'); },
  ask(b){ ask(b.dataset.q); },
  chatClear(){ if(confirm('Clear this chat?')){ LS.set(`fp:chat:${st.p}`, []); render(); } },
  settings(){ openSettings(); },
  close(){ $('#dlg').close(); },
  async testKey(b){
    const n = readSettingsForm(b.closest('form')); b.disabled = true; b.textContent = 'Testing…';
    try{ await groq([{ role:'user', content:'Reply with OK.' }], { key:n.groqKey, model:n.model }); toast('Connected to Groq.'); }
    catch(e){ toast(e.message); }
    b.disabled = false; b.textContent = 'Test connection';
  },
  export(){ exportData(); },
  import(){ $('#importFile').click(); },
  async wipe(){
    if(!confirm('Delete all Forge Plan data on this phone, including photos? Export a backup first if you want to keep it.')) return;
    Object.keys(localStorage).filter(k => k.startsWith('fp:')).forEach(k => localStorage.removeItem(k));
    await idb.clear().catch(()=>{}); S = loadS(); $('#dlg').close(); render(); toast('All data deleted.');
  }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if(!b || b.disabled) return; const f = A[b.dataset.a]; if(f){ e.preventDefault(); f(b, e); } });
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.c === 'kg'){ const k = dkey(), d = getDay(st.p, k), x = d.ex[t.dataset.id] || {}; x.kg = t.value.trim(); d.ex[t.dataset.id] = x; saveDay(st.p, k, d); toast('Saved.'); }
  if(t.id === 'importFile' && t.files[0]){ importData(t.files[0]); t.value = ''; }
});
document.addEventListener('submit', async e => {
  const f = e.target, kind = f.dataset.f; if(!kind) return; e.preventDefault();
  if(kind === 'addTodo'){ const v = f.t.value.trim(); if(!v) return; const k = dkey(), d = getDay(st.p, k); d.custom.push({ id:uid(), text:v, done:false }); saveDay(st.p, k, d); render(); }
  if(kind === 'foodManual'){ const k = st.foodDate, list = foodItems(k);
    list.push({ id:uid(), meal:$('#mealSel').value, name:f.name.value.trim(), qty:'', kcal:num(f.kcal.value), protein:num(f.protein.value), carbs:0, fat:0 });
    LS.set(`fp:food:${k}`, list); toast('Food added.'); render(); }
  if(kind === 'settings'){ S = readSettingsForm(f); LS.set('fp:settings', S); $('#dlg').close(); render(); toast('Settings saved.'); }
  if(kind === 'chat'){ const q = f.q.value; f.q.value = ''; ask(q); }
  if(kind === 'bodyAdd'){
    const p = st.p, kg = num(f.kg.value); if(kg < 25 || kg > 250) return toast('Enter your weight in kg.');
    const id = uid(), file = f.photo.files[0], btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Saving…';
    let photo = false;
    if(file){ try{ await idb.put('p:' + id, await compress(file)); photo = true; }catch(err){ toast('Could not save the photo. The weight was still saved.'); } }
    const list = weights(p); list.push({ id, date:f.date.value || dkey(), kg, waist: f.waist.value ? num(f.waist.value) : '', photo });
    LS.set(`fp:weights:${p}`, list); render(); toast('Check-in saved.');
  }
});

render();
if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
